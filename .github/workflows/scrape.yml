name: Daily Price Scrape

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 03:00 BRT
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date to scrape (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run scraper
        working-directory: scraper
        env:
          PYTHONUNBUFFERED: '1'
          SCRAPER_DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python main.py

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: scrape $(date -u +%Y-%m-%d)"
          git push
